<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quiz TZP</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--card:#ffffff;--text:#111827;--muted:#64748b;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626;--soft:#f1f5f9;--line:#e2e8f0;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:var(--text);min-height:100vh;overflow-x:hidden}
.wrap{max-width:1050px;margin:0 auto;padding:18px;width:100%;display:flex;flex-direction:column;align-items:center}
.hero{color:#fff;padding:18px 4px 12px;text-align:center;width:100%}
.hero h1{margin:0;font-size:clamp(28px,6vw,44px);line-height:1.1}
.topbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px auto;max-width:900px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px;color:#fff;padding:12px;text-align:center;min-width:0}
.stat b{display:block;font-size:22px}.stat span{overflow-wrap:anywhere}
.panel{background:var(--card);border-radius:22px;box-shadow:0 20px 55px rgba(0,0,0,.25);overflow:hidden;width:100%;max-width:980px;margin:0 auto}
.controls{padding:16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(160px,.8fr) minmax(160px,.8fr) minmax(150px,.6fr);gap:10px;align-items:center;justify-items:center;text-align:center;width:100%}
.controls input,.controls select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;min-height:42px;background:#fff;max-width:100%;min-width:0}
.controls input,.controls select,.controls .btn{width:100%;min-width:0}.controls .btn{white-space:normal}
.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;min-height:42px;max-width:100%;white-space:normal;text-align:center;display:inline-flex;align-items:center;justify-content:center;line-height:1.2}
.btn.secondary{background:#334155}.btn.light{background:#e2e8f0;color:#111827}.btn:disabled{opacity:.55;cursor:not-allowed}
.quiz{padding:18px;text-align:center}.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#2563eb);transition:.25s}.meta{display:flex;justify-content:center;gap:10px;color:var(--muted);font-size:14px;margin:12px 0;text-align:center;flex-wrap:wrap}.meta span{min-width:0;overflow-wrap:anywhere}.question{font-size:22px;font-weight:800;line-height:1.25;margin:10px 0 16px;overflow-wrap:anywhere}.answers{display:grid;gap:10px;max-width:900px;margin:0 auto}.ans{border:2px solid var(--line);background:#fff;border-radius:16px;padding:13px;text-align:left;font-size:16px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;min-width:0;overflow-wrap:anywhere}.ans:hover{border-color:#93c5fd;background:#eff6ff}.ans .letter{font-weight:900;color:#1d4ed8;min-width:24px}.ans.correct{border-color:var(--ok);background:#dcfce7}.ans.wrong{border-color:var(--bad);background:#fee2e2}.feedback{margin:14px auto 0;padding:14px;border-radius:16px;background:var(--soft);display:none;text-align:left;overflow-wrap:anywhere;max-width:900px}.feedback.ok{border-left:6px solid var(--ok)}.feedback.bad{border-left:6px solid var(--bad)}
.nav{padding:16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;text-align:center}.nav .btn{flex:1 1 190px;max-width:260px}
.results{display:none;padding:18px;text-align:center}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}.summary div{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:center}.summary b{font-size:26px;display:block}.reviewItem{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:#fff;text-align:left;overflow-wrap:anywhere}.reviewItem.good{border-left:6px solid var(--ok)}.reviewItem.bad{border-left:6px solid var(--bad)}.small{font-size:13px;color:var(--muted)}.hidden{display:none!important}
@media(max-width:720px){.wrap{padding:10px}.hero{padding:12px 2px}.controls{grid-template-columns:1fr;padding:12px}.controls input,.controls select,.controls .btn{width:100%;max-width:100%;font-size:15px}.quiz{padding:14px}.question{font-size:19px}.meta{flex-direction:column;align-items:center;text-align:center}.nav{display:grid;grid-template-columns:1fr;padding:12px}.nav .btn{width:100%;max-width:none;flex:none}.summary{grid-template-columns:1fr}.results{padding:14px}.panel{border-radius:18px}}
@media(max-width:380px){.topbar{grid-template-columns:1fr}.btn,.controls input,.controls select{font-size:14px;padding:11px 10px}.ans{font-size:15px;padding:12px 10px}.question{font-size:18px}}

.qimgWrap{display:flex;justify-content:center;margin:12px auto 16px auto;width:100%;}
.qimg{max-width:100%;width:min(560px,100%);height:auto;object-fit:contain;border-radius:14px;border:1px solid #d9e2ef;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.08);}
@media(max-width:520px){.qimg{width:100%;border-radius:10px}.question{font-size:18px}.answers{gap:12px}.ans{font-size:16px;line-height:1.25}.ans .letter{min-width:32px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>quiz TZP</h1>
  </div>
  <div class="panel">
    <div class="controls">
      <input id="search" placeholder="Filtruj pytania, np. rozgorzenie, linia główna, las...">
      <select id="category"><option value="all">Wszystkie działy</option></select>
      <select id="mode"><option value="all">Cały quiz</option><option value="20">Losowe 20</option><option value="40">Losowe 40</option><option value="60">Losowe 60</option><option value="wrong">Tylko błędne z ostatniej próby</option></select>
      <button class="btn" id="startBtn">Start / od nowa</button>
    </div>
    <div class="quiz" id="quizBox">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="meta"><span id="counter">Pytanie 0/0</span><span id="catLabel"></span></div>
      <div class="question" id="question">Kliknij „Start / od nowa”, żeby rozpocząć.</div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="results" id="results"></div>
    <div class="nav">
      <button class="btn light" id="prevBtn">← Poprzednie</button>
      <button class="btn secondary" id="showAnswerBtn">Pokaż odpowiedź</button>
      <button class="btn" id="nextBtn">Następne →</button>
    </div>
  </div>
</div>
<script>
const QUESTIONS = [{"q":"Pożar to:","options":["kontrolowany proces spalania w miejscu do tego przeznaczonym","niekontrolowany proces spalania w miejscu do tego nieprzeznaczonym, zagrażający zdrowiu, życiu lub mieniu","każde zadymienie bez płomieni","proces utleniania bez wydzielania ciepła"],"answer":1,"explanation":"Pożar jest niekontrolowanym procesem spalania w miejscu do tego nieprzeznaczonym.","category":"Pożar i podstawowe pojęcia"},{"q":"Pożar mały według powierzchni obejmuje:","options":["do 70 m²","powyżej 70 do 300 m²","powyżej 300 do 1000 m²","powyżej 1000 m²"],"answer":0,"explanation":"Mały pożar: powierzchnia do 70 m².","category":"Pożar i podstawowe pojęcia"},{"q":"Pożar średni według powierzchni obejmuje:","options":["do 70 m²","powyżej 70 do 300 m²","powyżej 300 do 1000 m²","powyżej 1000 m²"],"answer":1,"explanation":"Średni pożar: powyżej 70 do 300 m².","category":"Pożar i podstawowe pojęcia"},{"q":"Pożar duży według powierzchni obejmuje:","options":["powyżej 300 do 1000 m²","powyżej 70 do 300 m²","do 70 m²","powyżej 1000 m²"],"answer":0,"explanation":"Duży pożar: powyżej 300 do 1000 m².","category":"Pożar i podstawowe pojęcia"},{"q":"Pożar bardzo duży według powierzchni obejmuje:","options":["do 70 m²","powyżej 1000 m²","powyżej 300 do 1000 m²","powyżej 70 do 300 m²"],"answer":1,"explanation":"Bardzo duży pożar: powyżej 1000 m².","category":"Pożar i podstawowe pojęcia"},{"q":"Pożar mały według liczby prądów gaśniczych to pożar wymagający:","options":["do 4 prądów","5–12 prądów","13–36 prądów","powyżej 36 prądów"],"answer":0,"explanation":"Mały pożar wymaga do 4 prądów gaśniczych.","category":"Pożar i podstawowe pojęcia"},{"q":"Pożar średni według liczby prądów gaśniczych wymaga:","options":["do 4 prądów","5–12 prądów","13–36 prądów","powyżej 36 prądów"],"answer":1,"explanation":"Średni pożar: 5–12 prądów gaśniczych.","category":"Pożar i podstawowe pojęcia"},{"q":"Pożar ukryty rozwija się:","options":["tylko na zewnątrz budynku","w pustych przestrzeniach stropów, ścian lub podłóg bez oznak świecenia i żarzenia","wyłącznie w koronach drzew","tylko w cieczach palnych"],"answer":1,"explanation":"Pożar ukryty przebiega w pustych przestrzeniach, bez widocznych oznak świecenia i żarzenia.","category":"Pożar i podstawowe pojęcia"},{"q":"Pożar w zarodku to pożar, który:","options":["objął cały obiekt","nie rozprzestrzenił się poza miejsce powstania","wymaga co najmniej 13 prądów gaśniczych","dotyczy tylko lasu"],"answer":1,"explanation":"Pożar w zarodku pozostaje w miejscu powstania.","category":"Pożar i podstawowe pojęcia"},{"q":"Pożar wierzchołkowy oznacza:","options":["pożar całkowity lasu","pożar piwnicy","pożar w pustych przestrzeniach stropu","pożar tylko runa leśnego"],"answer":0,"explanation":"Wierzchołkowy to pożar całkowity lasu.","category":"Pożar i podstawowe pojęcia"},{"q":"W modelu integralnym pożaru wewnętrznego temperatura pożaru jest rozumiana jako:","options":["temperatura tylko przy podłodze","średnia temperatura gazów w stosunku do objętości pomieszczenia","temperatura płomienia na zewnątrz budynku","temperatura ścian nośnych"],"answer":1,"explanation":"Model integralny uśrednia temperaturę gazów w całej objętości pomieszczenia.","category":"Pożar i podstawowe pojęcia"},{"q":"W modelu strefowym pożaru wewnętrznego:","options":["każda strefa ma swoją temperaturę","temperatura jest zawsze jednakowa w całym pomieszczeniu","nie występuje strefa zadymienia","nie uwzględnia się promieniowania"],"answer":0,"explanation":"W modelu strefowym każda strefa ma inną wartość temperatury.","category":"Pożar i podstawowe pojęcia"},{"q":"Faza I rozwoju pożaru to:","options":["dopalenie resztek materiału","rozszerzanie się ognia od źródła zapalenia i szybki wzrost temperatury","stygnięcie pogorzeliska","pożar po pełnym objęciu całego pomieszczenia"],"answer":1,"explanation":"Faza I to rozwój od źródła zapalenia; pożar jest kontrolowany przez paliwo.","category":"Pożar i podstawowe pojęcia"},{"q":"W fazie II rozwoju pożaru temperatura w górnej strefie pożarowej może wzrosnąć do około:","options":["100–200°C","300–500°C","800–1200°C","1500–2000°C"],"answer":2,"explanation":"W fazie II wskazywany jest wzrost temperatury do 800–1200°C w górnej strefie.","category":"Pożar i podstawowe pojęcia"},{"q":"W przejściu z I do II fazy pożaru może wystąpić:","options":["rozgorzenie","stygnięcie pogorzeliska","usunięcie dymu","zawsze samoczynne zgaśnięcie"],"answer":0,"explanation":"Rozgorzenie może wystąpić w przejściu z fazy I do II.","category":"Pożar i podstawowe pojęcia"},{"q":"Faza III rozwoju pożaru to:","options":["rozszerzanie od źródła zapalenia","dopalenie resztek materiału palnego i spadek temperatury","stygnięcie do temperatury wyjściowej","wyłącznie etap rozgorzenia"],"answer":1,"explanation":"Faza III to dopalanie, spadek temperatury i zmniejszenie rozprzestrzeniania.","category":"Pożar i podstawowe pojęcia"},{"q":"Rozgorzenie, czyli flashover, to:","options":["samoczynne zgaśnięcie pożaru","nagłe przejście rosnącego pożaru w pożar w pełni rozwinięty","wyłącznie zadymienie bez płomieni","powolne stygnięcie pogorzeliska"],"answer":1,"explanation":"Rozgorzenie oznacza nagłe przejście do pożaru w pełni rozwiniętego.","category":"Pożar i podstawowe pojęcia"},{"q":"Ogniste języki w strefie podsufitowej, tzw. „skrzydła anioła”, oznaczają:","options":["zbliżanie się rozgorzenia","pewne zgaśnięcie pożaru","brak gazów pożarowych","wyłącznie pożar zewnętrzny"],"answer":0,"explanation":"Skrzydła anioła są oznaką zbliżającego się rozgorzenia.","category":"Pożar i podstawowe pojęcia"},{"q":"Backdraft powstaje najczęściej wskutek:","options":["nadmiaru środka pianotwórczego","nagłego dopływu powietrza do pomieszczenia z nagromadzonymi gazami pożarowymi","całkowitego braku materiałów palnych","schłodzenia gazów poniżej temperatury otoczenia"],"answer":1,"explanation":"Nagły dopływ powietrza może spowodować deflagrację nagromadzonych gazów.","category":"Pożar i podstawowe pojęcia"},{"q":"Oznaką zbliżania się backdraftu jest:","options":["jasny, lekki dym i pełna widoczność","ciężki, gęsty, czarny dym oraz zasysanie powietrza do pomieszczenia","brak dymu i niska temperatura","wyłącznie mały płomień na zewnątrz"],"answer":1,"explanation":"Do oznak należą ciężki czarny dym i zasysanie powietrza.","category":"Pożar i podstawowe pojęcia"},{"q":"Lokalizacja pożaru oznacza:","options":["ugaszenie bez możliwości ponownego wznowienia","powstrzymanie rozprzestrzeniania i ograniczenie intensywności spalania","tylko rozpoznanie wodne","zakończenie działań i zwinięcie sprzętu"],"answer":1,"explanation":"Lokalizacja to zatrzymanie rozprzestrzeniania i ograniczenie intensywności spalania.","category":"Pożar i podstawowe pojęcia"},{"q":"Likwidacja pożaru oznacza:","options":["ugaszenie pożaru tak, aby nie doszło do ponownego wznowienia spalania","tylko ograniczenie frontu pożaru","wyznaczenie pozycji wodnej","ustalenie punktu czerpania wody"],"answer":0,"explanation":"Likwidacja to pełne ugaszenie z wykluczeniem ponownego rozwoju.","category":"Pożar i podstawowe pojęcia"},{"q":"Front pożaru to część terenu, na której:","options":["liniowa szybkość rozprzestrzeniania pożaru jest największa","pożar zawsze jest najmniejszy","pracuje wyłącznie kierowca","znajduje się punkt czerpania wody"],"answer":0,"explanation":"Front to kierunek największego rozprzestrzeniania się pożaru.","category":"Pożar i podstawowe pojęcia"},{"q":"Tył pożaru znajduje się:","options":["po stronie największej szybkości rozprzestrzeniania","po przeciwnej stronie kierunku rozprzestrzeniania pożaru","wyłącznie w środku pożaru","zawsze przy punkcie czerpania wody"],"answer":1,"explanation":"Tył jest po przeciwnej stronie kierunku rozprzestrzeniania pożaru.","category":"Pożar i podstawowe pojęcia"},{"q":"Oś pożaru to:","options":["linia okalająca pożar","linia prostopadła do frontu, zgodna z kierunkiem rozprzestrzeniania","miejsce ustawienia rozdzielacza","linia zasilająca od hydrantu"],"answer":1,"explanation":"Oś przebiega prostopadle do frontu zgodnie z kierunkiem rozprzestrzeniania.","category":"Pożar i podstawowe pojęcia"},{"q":"Obwód pożaru to:","options":["linia okalająca powierzchnię pożaru","wyłącznie front pożaru","miejsce ustawienia pompy","droga dojazdowa dla SIS"],"answer":0,"explanation":"Obwód to linia okalająca powierzchnię/strefę spalania.","category":"Pożar i podstawowe pojęcia"},{"q":"Pozycja ogniowa obejmuje teren:","options":["od miejsca ustawienia rozdzielacza do pożaru","wyłącznie punkt czerpania wody","pomiędzy hydrantem a pompą","tylko miejsce dowodzenia"],"answer":0,"explanation":"Pozycja ogniowa jest najbliżej pożaru i zawiera linie oraz stanowiska gaśnicze.","category":"Pożar i podstawowe pojęcia"},{"q":"Pozycja wężowa to teren:","options":["między pozycją ogniową a wodną","tylko wewnątrz obiektu","wyłącznie przy punkcie czerpania wody","za tyłem pożaru"],"answer":0,"explanation":"Na pozycji wężowej znajdują się linia główna i stanowisko rozdzielacza.","category":"Pożar i podstawowe pojęcia"},{"q":"Pozycja wodna to miejsce, gdzie znajdują się:","options":["punkty czerpania wody, pompy, linie ssawne lub zasilające","stanowiska gaśnicze przy ognisku","wyłącznie KDR","tylko roty z prądownicami"],"answer":0,"explanation":"Pozycja wodna obejmuje stanowisko wodne, pompy i pobór wody.","category":"Pożar i podstawowe pojęcia"},{"q":"Rota to:","options":["2-osobowy zespół ratowników","3–6 ratowników z dowódcą","2 zastępy","3 plutony"],"answer":0,"explanation":"Rota to dwuosobowy zespół ratowników.","category":"Pododdziały i pojazdy pożarnicze"},{"q":"Zastęp to pododdział liczący:","options":["2 ratowników","3–6 ratowników wraz z dowódcą","9–12 ratowników","15–21 ratowników"],"answer":1,"explanation":"Zastęp liczy od 3 do 6 ratowników wraz z dowódcą.","category":"Pododdziały i pojazdy pożarnicze"},{"q":"Sekcja to:","options":["2 zastępy, 9–12 ratowników wraz z dowódcą","3–4 zastępy, 15–21 ratowników","3 plutony","3–5 kompanii"],"answer":0,"explanation":"Sekcja składa się z 2 zastępów.","category":"Pododdziały i pojazdy pożarnicze"},{"q":"Pluton to:","options":["2 zastępy","3–4 zastępy albo 2 sekcje, 15–21 ratowników","3–5 kompanii","pojedynczy pojazd z załogą"],"answer":1,"explanation":"Pluton składa się z 3–4 zastępów albo 2 sekcji.","category":"Pododdziały i pojazdy pożarnicze"},{"q":"Kompania składa się z:","options":["3 plutonów lub 4 sekcji","2 ratowników","jednego zastępu","3–5 batalionów"],"answer":0,"explanation":"Kompania to 3 plutony albo 4 sekcje wraz z dowódcą.","category":"Pododdziały i pojazdy pożarnicze"},{"q":"Batalion to oddział liczący:","options":["3–5 kompanii","2 zastępy","3–4 zastępy","jedną brygadę"],"answer":0,"explanation":"Batalion liczy od 3 do 5 kompanii.","category":"Pododdziały i pojazdy pożarnicze"},{"q":"Patrol to:","options":["stały pododdział złożony z 3 plutonów","zespół 2–3 ratowników tworzony doraźnie na miejscu akcji","załoga samochodu operacyjnego","cała zmiana służbowa"],"answer":1,"explanation":"Patrol tworzy się doraźnie na miejscu akcji z 2–3 ratowników.","category":"Pododdziały i pojazdy pożarnicze"},{"q":"Masa rzeczywista całkowita pojazdu obejmuje:","options":["tylko masę własną pojazdu","masę własną, załogę, środki gaśnicze i całe wyposażenie","tylko wodę i paliwo","tylko masę sprzętu specjalnego"],"answer":1,"explanation":"MRC obejmuje pojazd, załogę, środki gaśnicze i wyposażenie.","category":"Pododdziały i pojazdy pożarnicze"},{"q":"W obliczaniu masy pojazdu masa każdego członka załogi z wyposażeniem przyjmowana jest jako:","options":["50 kg","75 kg","90 kg","120 kg"],"answer":2,"explanation":"W notatkach przyjęto 90 kg na członka załogi z wyposażeniem.","category":"Pododdziały i pojazdy pożarnicze"},{"q":"Samochód lekki według MMR to pojazd o masie:","options":["3 t < MMR ≤ 7,5 t","7,5 t < MMR ≤ 16 t","MMR ≥ 16 t","MMR > 30 t"],"answer":0,"explanation":"Lekki: 3 t < MMR ≤ 7,5 t.","category":"Pododdziały i pojazdy pożarnicze"},{"q":"Samochód średni według MM gzamin końcowy"},{"q":"Nawodnienie linii gaśniczej i podanie wody następuje na wyraźną komendę:","options":["KDR-a","Kierowcy","Prądownika","Dowódcy zastępu"],"answer":2,"explanation":"Wodę podaje się na wyraźną komendę prądownika.","category":"Przykładowy egzamin końcowy"},{"q":"Pododdział składający się z pięciu ratowników i dowódcy, wyposażony w pojazd przystosowany do realizacji zadania ratowniczego, nazywamy:","options":["Rotą","Sekcją","Plutonem","Zastępem"],"answer":3,"explanation":"Zastęp to pododdział od 3 do 6 ratowników wraz z dowódcą i pojazdem.","category":"Przykładowy egzamin końcowy"},{"q":"Kto obsługuje rozdzielacz podczas prowadzenia działań gaśniczych z użyciem jednego prądu gaśniczego przez zastęp 6-osobowy?","options":["Pomocnik roty I","Pomocnik roty II","Przodownik roty I","Przodownik roty II"],"answer":3,"explanation":"Przy jednym prądzie gaśniczym rozdzielacz obsługuje przodownik roty II.","category":"Przykładowy egzamin końcowy"},{"q":"Podanie podczas pożaru wewnętrznego do strefy podsufitowej zbyt dużej ilości wody, która gwałtownie odparowuje, zwiększa objętość i z dymem schodzi do poziomu podłogi, powoduje powstanie zjawiska:","options":["Rozgorzenia","Pułapki wodnej","Uderzenia hydraulicznego","Wstecznego ciągu płomieni"],"answer":1,"explanation":"Opis dotyczy pułapki wodnej.","category":"Przykładowy egzamin końcowy"},{"q":"Którym chwytem możliwa jest ewakuacja poszkodowanego przez jednego ratownika?","options":["Strażackim","Na stołeczku","Kończynowym","Huśtawkowym"],"answer":0,"explanation":"Chwyt strażacki umożliwia ewakuację przez jednego ratownika.","category":"Przykładowy egzamin końcowy"},{"q":"Lokalizacja pożaru to:","options":["Podjęcie działań gaśniczych","Zakończenie działań gaśniczych","Wyeliminowanie możliwości ponownego wznowienia palenia","Powstrzymanie rozprzestrzeniania się pożaru i ograniczenie jego intensywności"],"answer":3,"explanation":"Lokalizacja oznacza powstrzymanie rozprzestrzeniania się i ograniczenie intensywności pożaru.","category":"Przykładowy egzamin końcowy"},{"q":"Poza strefą zagrożenia rota asekuracyjna:","options":["Może realizować inne zadania, ale musi być przygotowana do wsparcia roty pierwszej lub pomocy w ewakuacji poza strefą zagrożenia","Nie może realizować innych zadań, ale musi być przygotowana do wsparcia roty pierwszej lub pomocy w ewakuacji poza strefą zagrożenia","Może realizować inne zadania, ale musi być przygotowana do wejścia do strefy i wsparcia roty pierwszej lub pomocy w ewakuacji","Nie może realizować innych zadań i musi być przygotowana do wejścia do strefy oraz wsparcia roty pierwszej lub pomocy w ewakuacji"],"answer":2,"explanation":"Rota asekuracyjna może wykonywać inne zadania, ale ma być gotowa do wejścia do strefy i udzielenia wsparcia.","category":"Przykładowy egzamin końcowy"},{"q":"Obszar, na którym znajdują się główne linie wężowe ułożone między stanowiskiem wodnym a rozdzielaczem, nazywa się pozycją:","options":["Wodną","Wężową","Gaśniczą","Ogniową"],"answer":1,"explanation":"Pozycja wężowa obejmuje linie główne i rejon rozdzielacza.","category":"Przykładowy egzamin końcowy"},{"q":"Linię gaśniczą zbudowaną z odcinków W-52, prowadzoną po drabinie ratowniczej dwuprzęsłowej wysuwanej, należy zabezpieczyć:","options":["Opaską wężową","Podpinką linkową","Łącznikiem kątowym","Podpinką ratowniczą"],"answer":1,"explanation":"Na drabinie linię W-52 zabezpiecza się podpinką linkową.","category":"Przykładowy egzamin końcowy"},{"q":"Linię wężową prowadzoną prostopadle do osi jezdni należy zabezpieczyć przed poruszającymi się pojazdami za pomocą:","options":["Opaski wężowej","Maty sprzętowej","Drabiny nasadkowej","Mostków przejazdowych"],"answer":3,"explanation":"Na jezdni linie wężowe zabezpiecza się mostkami przejazdowymi.","category":"Przykładowy egzamin końcowy"},{"q":"Który rodzaj prądu gaśniczego stosuje się do wypierania dymu z pomieszczenia?","options":["Zwarty","Mgłowy","Mieszany","Rozdzielony"],"answer":1,"explanation":"Do wypierania dymu stosuje się prąd mgłowy.","category":"Przykładowy egzamin końcowy"},{"q":"Stanowiska wodne do poboru wody do celów gaśniczych mogą być organizowane jako stałe oraz:","options":["Doraźne","Mobilne","Ruchome","Zewnętrzne"],"answer":0,"explanation":"Stanowiska wodne mogą być stałe lub doraźne.","category":"Przykładowy egzamin końcowy"},{"q":"Formą działania taktycznego polegającą na bezpośrednim oddziaływaniu na ognisko pożaru w celu przerwania procesu spalania jest:","options":["Obrona","Natarcie","Zasilanie","Zabezpieczanie"],"answer":1,"explanation":"Natarcie polega na bezpośrednim oddziaływaniu na ognisko pożaru.","category":"Przykładowy egzamin końcowy"},{"q":"Oznaczenie operacyjne pojazdu przedstawione na grafice oznacza samochód:","options":["Lekki gaśniczy","Ciężki gaśniczy","Ratownictwa drogowego","Ratownictwa technicznego"],"answer":1,"explanation":"W przedstawionym oznaczeniu chodzi o ciężki samochód gaśniczy.","category":"Przykładowy egzamin końcowy","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIQAAAAxCAIAAACUIZY2AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAmjElEQVR4nJ1ch1bcypblj2bNvHevAZNzDk3OxhhssMlOOIHBNmByNsFEk2OTGuhuOqkldTfge2d+aHbVkcoyfve9N6Ol1Uuo1VLV2efss09ViSBVVb1eL30qfMOBx+ORZTkQCFxdXfl8PnaBovq8SkDxXal+n1cOKOq1z48NF9zc3OBi3AG/VQ1bgG+4Bnegb3ExDnCGztMxbfgWD6U74HF0Q9roKfiJOEOX0a+Ml9GGn/v4dq1vf1zfoLVosyp5sftZR1Ta/bJ6pfoUjxTAp6I4HA5JkujpuJXs9khOl19WvC636vEGZFVyuLxON26CX+ErfOJbnyTjPriJ4vHiMlwMW8FQeBC+wrHs8uAy/ByXqZKMH+IO+Mp96ZiZmJr7Mm3e2XNa7UH/HAx0iToM42kP9sp4DO6LA3xLgFHT8SeBh9/iV7fAwEkyH/3qFhj0E8IJF9C3t8Cg8+KrW2Bc6ZsAI6BvN7gBHutVbnw4DqAjv4LhV1gLXS4X9V3rkSQL06PvwAbmk/gZ2Nd96WQ2hR0YGAohgd0DwFzuAL8zPpkTeLwMDP5E9lu3x+vyKG7p4vRsZX5xf2vHdnaB2/5rMMjH4Y10X7brB8KyuJhgIyto+P0MhvEpv4JBMNAdbkXY/zsyxMaC2KuwmODu+aMjBjB8Mus4wsLtdgswcAHMCtsxQ3O7exxOAgM7vpXdEvm4EQyJg4GL6SsWGW6PEQx2n0snHgpoAYPjwuayXwLdIGo9xSb6JvONjEIGokiHBWBJH98VGXyCnXUADoUA91PHqHFeGQfX/sD3wHWAO9QVpwgc05VX/gDZCCYWFhTGJVxFqJFd0LxbCInwEsAQSOiLn7eEG1q5CVwBiWtOreg8msctK+FbYIAd3+Ir2BcmY9aEm+NKiR0wb+PXw6DA y kąt podania prądu gaśniczego w natarciu przy gaszeniu pożarów wewnętrznych?","options":["60° względem podłoża, kąt rozproszenia 45°","45° względem podłoża, kąt rozproszenia 65°","45° względem podłoża, kąt rozproszenia dla prądów zwartych 25°","12° względem podłoża, kąt rozproszenia dla prądów zwartych 45°"],"answer":1,"explanation":"Optymalnie: 45° względem podłoża i 65° kąta rozproszenia.","category":"Przykładowy egzamin końcowy"},{"q":"Linię gaśniczą zbudowaną z odcinków W-52, prowadzoną przez górną krawędź betonowego przęsła ogrodzeniowego, należy zabezpieczyć:","options":["Opaską wężową","Łącznikiem kątowym","Siodełkiem wężowym","Mostkiem przejazdowym"],"answer":2,"explanation":"Na ostrej/górnej krawędzi stosuje się siodełko wężowe.","category":"Przykładowy egzamin końcowy"},{"q":"Co oznaczają opisane znaki gestowe? 1. Prawa ręka podniesiona w górę; 2. Podniesioną w górę prawą ręką wykonać ruchy poprzeczne; 3. Dłońmi obu podniesionych rąk wykonywać szybkie ruchy poprzeczne; 4. Zgiętą ręką wykonać ruch pionowy.","options":["1 – „woda stój”, 2 – „uwaga”, 3 – „woda naprzód”, 4 – „zmniejsz ciśnienie”","1 – „uwaga”, 2 – „woda stój”, 3 – „wszystkie roty”, 4 – „zmniejsz ciśnienie”","1 – „uwaga”, 2 – „woda stój”, 3 – „niebezpieczeństwo”, 4 – „zwiększ ciśnienie”","1 – „woda stój”, 2 – „uwaga”, 3 – „niebezpieczeństwo”, 4 – „zwiększ ciśnienie”"],"answer":2,"explanation":"Prawidłowy zestaw to: uwaga, woda stój, niebezpieczeństwo, zwiększ ciśnienie.","category":"Przykładowy egzamin końcowy"},{"q":"Jakie czynniki mają wpływ na powstanie rozgorzenia „flashover” w pomieszczeniu?","options":["Usytuowanie bodźca energetycznego","Duża ilość materiałów trudnopalnych","Duża ilość materiałów rozdrobnionych","Wielkość i kształt otworów wentylacyjnych"],"answer":2,"explanation":"Duża ilość materiałów rozdrobnionych sprzyja szybkiemu rozwojowi pożaru i rozgorzeniu.","category":"Przykładowy egzamin końcowy"},{"q":"Który rodzaj prądu gaśniczego należy zastosować, gdy środek gaśniczy trzeba podać na dużą odległość?","options":["Zwarty","Mgłowy","Kroplisty","Rozproszony"],"answer":0,"explanation":"Na dużą odległość stosuje się prąd zwarty.","category":"Przykładowy egzamin końcowy"},{"q":"Gotowość operacyjna podmiotów KSRG to:","options":["Planowanie, organizowanie, nadzorowanie i koordynowanie działań ratowniczych","Stworzenie możliwości oceny stanu poszkodowanego i możliwości jego przemieszczania","Zdolność do realizowania czynności ratowniczych w poszczególnych dziedzinach ratownictwa","Czynności wykonywane w poszczególnych dziedzinach ratownictwa przez wszystkich ratowników"],"answer":2,"explanation":"Gotowość operacyjna to zdolność do realizowania czynności ratowniczych.","category":"Przykładowy egzamin końcowy"},{"q":"Jakie ciśnienie panuje podczas pożaru w strefie „3” przy założeniu, że „p” to ciśnienie w strefie, a „pz” to ciśnienie na zewnątrz pomieszczenia?","options":["P = pz","P < pz","P <= pz","P > pz"],"answer":3,"explanation":"W strefie 3 ciśnienie jest większe od ciśnienia zewnętrznego.","category":"Przykładowy egzamin końcowy","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALUAAAB8CAIAAACg1maCAAAACXBIWXMAAA7EAAAOxAGVKw4bAABiT0lEQVR4nO3dCZdVRZY3fD5Lr2e9/azuft6qruqqLmvQ0iqHKgWZZ5BBZRJBCwdwnmcRRAUHcEQFVFQUnHBmRqacM9Fytuz2O7y/PH9v9MmbmShY1d3P6jfWXTdPnhsnTsTe/9h7x44dEUPuvPPOO+644+abb25ra2tvb3/vvfduu+22xx577NChQ5s2bVq8ePG6detWrly5efPmW2+9VeaXX3759ttv371794YNGzz4zDPPjB8/fvny5fJs27Zt1apVixYtWrJkyWWXXeaRa665ZvXq1e+//75y5LzvvvtkVvInn3wya9YsJb/zzjtvvPGGOx999FFrlToGSV2N1NnZ6V9VVWH5W6qkhIMHD+7fv3/fvn0ffPDB3r17P6jSviodOHBABtnkLxceV47SlNnd3T3Ye//qqb1KbY10zI+HXKWcEEFLESHtDUNb2/b7tLTu8znU8sGBg3v27d+Vzwf7du7Zu33vBztc+6m942BX97cFFsIOQT40QlAcUq6LNWvWLFu27O233965c+eWLVvw79VXX/XMW2+9haMbN27008cffww9cipo7dq18PTcc89t3bo1108//fTSpUsh6ZFHHoGh119/HXrWr1/vJyVj2yuvvHLBBRfIrPyXXnoJ2rRck7RnMLqEkf3xkZYEH+ofQBRkSOjlpwKLfEt5Vyn2B3D8GBl8bPioN7+eCgWSSpMPHtpbPsCx/8DuIKNc+Ljwa1v7gY7OQ03kHaKUw4cPA0dHxSGMd4GjOOc1n3/+OebJqofp9BCzY8eOUNPDfnJfJfbs2eOOOmGMF3z44YcEg3/l8 a zewnątrz budynku lub poza jego obszarem","wyłącznie w piwnicy","tylko w pustych przestrzeniach stropów"],"answer":1,"explanation":"Pożar zewnętrzny rozwija się na zewnątrz budynku lub poza jego obszarem.","category":"Pożar i podstawowe pojęcia"},{"q":"W modelu integralnym pożaru wewnętrznego strefa I oznacza:","options":["strefę spalania","strefę zadymienia","strefę oddziaływania promieniowania cieplnego","strefę rozdzielacza"],"answer":0,"explanation":"W modelu integralnym I oznacza strefę spalania.","category":"Pożar i podstawowe pojęcia"},{"q":"W modelu integralnym pożaru wewnętrznego strefa II oznacza:","options":["strefę spalania","strefę oddziaływania promieniowania cieplnego","strefę zadymienia","pozycję wodną"],"answer":1,"explanation":"Strefa II to strefa oddziaływania promieniowania cieplnego.","category":"Pożar i podstawowe pojęcia"},{"q":"W modelu integralnym pożaru wewnętrznego strefa III oznacza:","options":["strefę zadymienia","strefę spalania","strefę wodną","strefę rozdzielacza"],"answer":0,"explanation":"Strefa III to strefa zadymienia.","category":"Pożar i podstawowe pojęcia"},{"q":"W modelu strefowym pożaru wewnętrznego najwyższa temperatura w notatkach występuje w:","options":["strefie I","strefie II","strefie III","pozycji wodnej"],"answer":2,"explanation":"W modelu strefowym zapisano, że temperatura III jest większa od temperatury II.","category":"Pożar i podstawowe pojęcia"},{"q":"W fazie I rozwoju pożaru pożar jest kontrolowany głównie przez:","options":["paliwa","wentylację","środki pianotwórcze","działanie pomp"],"answer":0,"explanation":"Faza I jest kontrolowana przez paliwa.","category":"Pożar i podstawowe pojęcia"},{"q":"W fazie II rozwoju pożaru pożar jest kontrolowany głównie przez:","options":["paliwa","wentylację","temperaturę otoczenia","wilgotność powietrza"],"answer":1,"explanation":"Faza II jest kontrolowana przez wentylację.","category":"Pożar i podstawowe pojęcia"},{"q":"Faza IV rozwoju pożaru to:","options":["rozszerzanie s ","przesyłaniu wody do zbiornika pośredniego i zasysaniu przez kolejną pompę","wyłącznie dowożeniu wody samochodami","podaniu wody tylko z hydrantu"],"answer":0,"explanation":"Przetłaczanie: pompa do pompy przez linię.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Przepompowywanie polega na:","options":["przesyłaniu wody do pośredniego zbiornika i dalej przez następną pompę","bezpośrednim łączeniu nasady tłocznej z ssawną następnej pompy bez zbiornika","wyłącznie tankowaniu pojazdów","podaniu wody tylko do prądownicy"],"answer":0,"explanation":"Przepompowywanie wykorzystuje zbiorniki pośrednie.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Ciśnienie dyspozycyjne Hd to:","options":["ciśnienie przewidziane do pokonania oporów przepływu w linii tłocznej między pompami","ciśnienie atmosferyczne","ciśnienie w oponach pojazdu","ciśnienie w butli LPG"],"answer":0,"explanation":"Hd służy do pokonania oporów przepływu między pompami.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Przy pompach o różnej wydajności pompę o większej wydajności ustawia się:","options":["najbliżej punktu czerpania wody","najdalej od punktu czerpania","zawsze pośrodku układu","wyłącznie przy rozdzielaczu"],"answer":0,"explanation":"Większą pompę ustawia się najbliżej punktu czerpania.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Minimalne ciśnienie na nasadzie ssawnej pompy pośredniej powinno wynosić:","options":["0,15 MPa","1,21 MPa","10 MPa","0 MPa"],"answer":0,"explanation":"W notatkach: 0,15 MPa, czyli 1,5 bar.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Ciśnienie 0,15 MPa na nasadzie ssawnej pompy pośredniej zapobiega:","options":["zablokowaniu przepływu po zbiegnięciu się ścianek węży tłocznych","zamarzaniu paliwa","zapaleniu środka pianotwórczego","uszkodzeniu radiostacji"],"answer":0,"explanation":"To zabezpiecza przed zablokowaniem przepływu.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Wzór na liczbę pojazdów przy dowożeniu wody to:","options":["B = V · t / q","L = Hd · 100 / r","V = q / t","Hd = L · q"],"answer":0,"explanation":"Dowożenie: B = V · t / q.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"We wzorze B = V · t / q symbol V oznacza:","options":["zapotrzebowanie wody w l/min","pełen obrót pojazdu","pojemność zbiornika pojazdu","liczbę pomp"],"answer":0,"explanation":"V to zapotrzebowanie wody.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"We wzorze B = V · t / q symbol t oznacza:","options":["czas pełnego obrotu pojazdu","pojemność zbiornika","wydajność hydrantu","ciśnienie dyspozycyjne"],"answer":0,"explanation":"t to pełen obrót pojazdu.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"We wzorze B = V · t / q symbol q oznacza:","options":["pojemność zbiornika pojazdu","czas obrotu pojazdu","zapotrzebowanie wody","opory linii"],"answer":0,"explanation":"q to pojemność zbiornika pojazdu.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Dla GBA 2,5/16 czas napełnienia zbiornika w notatkach wynosi około:","options":["2,5 min","10 min","30 s","15 min"],"answer":0,"explanation":"W notatkach podano 2,5 min dla GBA 2,5/16.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Przy dowożeniu wody zakładana prędkość przejazdu w notatkach wynosi:","options":["30 km/h","50 km/h","80 km/h","10 km/h"],"answer":0,"explanation":"W notatkach przyjęto 30 km/h.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Zaletą dowożenia wody jest:","options":["możliwość korzystania z kilku punktów poboru wody","brak zaangażowania pojazdów","brak potrzeby doboru liczby pojazdów","zawsze zerowy czas obrotu"],"answer":0,"explanation":"Dowożenie umożliwia pobór z kilku punktów.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Warunkiem sprawnego dowożenia jest m.in.:","options":["swoboda manewrowania okrężnie, bez cofania","ustawienie pojazdów tak, aby musiały cofać","brak stałej obsługi punktu czerpania","dobór najsłabszych pomp"],"answer":0,"explanation":"Sprawne dowożenie wymaga swobody ruchu i stałej obsługi punktu.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"System mieszany podawania wody jest:","options":["elastyczny i możliwy do wykorzystania w różnych warunkach z dostępnym sprzętem","zakazany przy pożarach dużych","wyłącznie systemem pianowym","zawsze wolniejszy od każdego innego"],"answer":0,"explanation":"System mieszany jest elastyczny.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"},{"q":"Aby zapewnić ciągłość podawania wody, należy m.in.:","options":["dobrać punkty czerpania gwarantujące stały pobór i zapewnić wymianę ratowników oraz sprzętu","używać wyłącznie jednego punktu bez kontroli","nie uzupełniać paliwa","wydłużyć czas budowy systemu"],"answer":0,"explanation":"Ciągłość wymaga pewnych punktów poboru, obsługi i uzupełniania zasobów.","category":"Pożary lasów, transport, MZ i zaopatrzenie wodne"}];
const letters = ['A','B','C','D'];
let pool=[], order=[], current=0, answered=false, score=0, wrongIds=[], userAnswers={};
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function normalize(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function initCats(){const cats=[...new Set(QUESTIONS.map(q=>q.category))].sort();cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('category').appendChild(o)});if($('totalStat')) $('totalStat').textContent=QUESTIONS.length}
function buildPool(){let s=normalize($('search').value), cat=$('category').value, mode=$('mode').value;let base=QUESTIONS.map((q,i)=>({...q,id:i})).filter(q=>(cat==='all'||q.category===cat) && (!s||normalize(q.q+' '+q.options.join(' ')+' '+q.explanation).includes(s)));if(mode==='wrong'){base=base.filter(q=>wrongIds.includes(q.id)); if(!base.length) base=QUESTIONS.map((q,i)=>({...q,id:i})).filter(q=>false)}else if(mode!=='all'){base=shuffle(base).slice(0,Number(mode));}return shuffle(base)}
function start(){pool=buildPool();order=pool.map((q,idx)=>idx);current=0;score=0;userAnswers={};answered=false;if(!pool.length){$('question').textContent='Brak pytań dla wybranego filtra albo brak błędnych z ostatniej próby.';$('answers').innerHTML='';$('counter').textContent='Pytanie 0/0';$('bar').style.width='0%';$('feedback').style.display='none';updateStats();return}pool=pool.map(q=>{let opts=q.options.map((text,i)=>({text,correct:i===q.answer}));shuffle(opts);return {...q,shuffled:opts}});$('results').style.display='none';$('quizBox').style.display='block';render()}
function render(){answered=userAnswers[pool[current].id]!==undefined;const q=pool[current];$('counter').textContent=`Pytanie ${current+1}/${pool.length}`;$('catLabel').textContent=q.category;$('question').innerHTML=(q.image?`<div>${q.q}</div><div class="qimgWrap"><img class="qimg" src="${q.image}" alt="grafika do pytania"></div>`:q.q);$('bar').style.width=((current)/pool.length*100)+'%';$('answers').innerHTML='';q.shuffled.forEach((opt,i)=>{const b=document.createElement('button');b.className='ans';b.innerHTML=`<span class="letter">${letters[i]}.</span><span>${opt.text}</span>`;b.onclick=()=>choose(i);if(answered){const chosen=userAnswers[q.id];if(opt.correct)b.classList.add('correct');if(i===chosen && !opt.correct)b.classList.add('wrong');b.disabled=true} $('answers').appendChild(b)});if(answered){showFeedback()}else{$('feedback').style.display='none'}$('prevBtn').disabled=current===0;$('nextBtn').textContent=current===pool.length-1?'Zakończ / wyniki →':'Następne →';updateStats()}
function choose(i){if(answered)return;const q=pool[current];answered=true;userAnswers[q.id]=i;const correct=q.shuffled[i].correct;if(correct) score++; render()}
function showFeedback(force=false){const q=pool[current];const chosen=userAnswers[q.id];let correctIndex=q.shuffled.findIndex(o=>o.correct);let was=chosen!==undefined && q.shuffled[chosen].correct;const fb=$('feedback');fb.className='feedback '+(was?'ok':'bad');fb.style.display='block';fb.innerHTML=`<b>${was?'Dobrze ✅':'Źle ❌'}</b><br>Poprawna odpowiedź: <b>${letters[correctIndex]}. ${q.shuffled[correctIndex].text}</b><br><span>${q.explanation}</span>`}
function showAnswer(){if(!pool.length)return;const q=pool[current];if(userAnswers[q.id]===undefined){userAnswers[q.id]=q.shuffled.findIndex(o=>o.correct); score++;}render()}
function next(){if(!pool.length)return;if(current<pool.length-1){current++;render()}else finish()}
function prev(){if(current>0){current--;render()}}
function finish(){const answeredCount=Object.keys(userAnswers).length;wrongIds=pool.filter(q=>{const a=userAnswers[q.id];return a===undefined || !q.shuffled[a].correct}).map(q=>q.id);$('quizBox').style.display='none';$('results').style.display='block';$('bar').style.width='100%';let pct=pool.length?Math.round(score/pool.length*100):0;let html=`<h2>Wynik końcowy</h2><div class="summary"><div><span>Poprawne</span><b>${score}</b></div><div><span>Błędne / pominięte</span><b>${pool.length-score}</b></div><div><span>Procent</span><b>${pct}%</b></div></div><p class="small">Pominięte pytania liczą się jako błędne w wyniku końcowym.</p><button class="btn" onclick="start()">Powtórz quiz</button> <button class="btn secondary" onclick="setWrongMode()">Powtórz tylko błędne</button><h3>Przegląd odpowiedzi</h3>`;pool.forEach((q,idx)=>{const a=userAnswers[q.id];const correct=q.shuffled.findIndex(o=>o.correct);const good=a!==undefined && q.shuffled[a].correct;html+=`<div class="reviewItem ${good?'good':'bad'}"><b>${idx+1}. ${q.q}</b><br><span>Twoja: ${a===undefined?'brak':letters[a]+'. '+q.shuffled[a].text}</span><br><span>Poprawna: <b>${letters[correct]}. ${q.shuffled[correct].text}</b></span><br><small>${q.explanation}</small></div>`});$('results').innerHTML=html;updateStats()}
function setWrongMode(){ $('mode').value='wrong'; start(); }
function updateStats(){let answeredCount=Object.keys(userAnswers).length;let bad=Math.max(0,answeredCount-score);if($('okStat')) $('okStat').textContent=score;$('badStat').textContent=bad;let pct=answeredCount?Math.round(score/answeredCount*100):0;if($('pctStat')) $('pctStat').textContent=pct+'%' }
$('startBtn').onclick=start;$('nextBtn').onclick=next;$('prevBtn').onclick=prev;$('showAnswerBtn').onclick=showAnswer;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')start()});$('category').onchange=start;$('mode').onchange=start;initCats();
</script>
